[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "home-network-monitor"
version = "0.1.0"
description = "Scheduled home network quality measurements stored in PostgreSQL"
requires-python = ">=3.12"
dependencies = [
  "APScheduler==3.11.1",
  "psycopg[binary]==3.2.12",
  "tzdata==2025.2",
]

[project.scripts]
netwatch = "netwatch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
